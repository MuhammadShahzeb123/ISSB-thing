<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">A father and son at a dry field</title>
  <desc id="d">An older farmer in a turban leans on a spade beside his teenage son at the edge of a dry, cracked field. Heavy clouds gather over a distant village. The boy looks up at the sky while the father looks across the field.</desc>
