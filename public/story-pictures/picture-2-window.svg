    <path d="M 392 142 L 401 141" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 395 170 L 402 170" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 352 132 Q 380 104 408 128 Q 392 122 378 132 Q 366 150 364 180 L 346 176 Q 344 150 352 132 Z" fill="#a3a3a3"/>
  </g>
  <rect width="800" height="520" filter="url(#grain)" opacity="0.6"/>
</svg>
