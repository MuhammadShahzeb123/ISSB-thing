    <!-- woman, three-quarter back view, facing the window -->
    <ellipse cx="376" cy="452" rx="70" ry="9" fill="#6a6a6a" opacity="0.45"/>
    <path d="M 350 380 L 348 446 L 370 446 L 374 380 Z" fill="#6b6b6b"/>
    <path d="M 384 380 L 388 446 L 408 446 L 404 380 Z" fill="#6b6b6b"/>
    <ellipse cx="358" cy="450" rx="15" ry="6" fill="#2f2f2f"/>
