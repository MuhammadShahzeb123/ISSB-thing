    <rect x="132" y="328" width="8" height="82" fill="#5e5e5e"/>
    <rect x="250" y="328" width="8" height="82" fill="#5e5e5e"/>
    <g transform="rotate(-8 180 308)"><rect x="152" y="298" width="58" height="36" fill="#ececec" stroke="#8a8a8a" stroke-width="2"/><path d="M 152 298 L 181 318 L 210 298" stroke="#8a8a8a" stroke-width="2" fill="none"/></g>
    <path d="M 226 296 L 250 296 L 247 318 L 229 318 Z" fill="#9a9a9a" stroke="#6a6a6a" stroke-width="2"/>
    <!-- bag -->
    <rect x="560" y="392" width="118" height="70" rx="10" fill="#555"/>
    <path d="M 596 392 Q 619 364 642 392" stroke="#3f3f3f" stroke-width="7" fill="none"/>
    <rect x="560" y="418" width="118" height="6" fill="#474747"/>
