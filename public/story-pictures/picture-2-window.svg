    <path d="M 410 196 C 420 208 428 214 440 214" stroke="#6d6d6d" stroke-width="15" fill="none" stroke-linecap="round"/>
    <ellipse cx="443" cy="212" rx="7" ry="9" fill="#a5a5a5"/>
    <path d="M 348 196 C 340 240 344 280 352 300" stroke="#6d6d6d" stroke-width="15" fill="none" stroke-linecap="round"/>
