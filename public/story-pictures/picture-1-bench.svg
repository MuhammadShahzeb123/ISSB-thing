<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Two men on a bench at dusk</title>
  <desc id="d">An older man sits on a park bench, leaning forward with his hands clasped and eyes lowered. A younger man beside him has turned toward him. The sky is grey and a bare tree stands nearby.</desc>
